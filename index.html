<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>XBill</title>
<style>
:root {
	--bg: #14141a;
	--panel: #1e1e28;
	--panel-2: #262633;
	--line: #35354a;
	--ink: #e8e8f2;
	--muted: #9a9ab4;
	--accent: #e8a33d;
	--accent-ink: #1a1a22;
}
* { box-sizing: border-box; }
html, body {
	margin: 0; padding: 0; height: 100%;
	background: var(--bg); color: var(--ink);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	-webkit-font-smoothing: antialiased;
	overscroll-behavior: none;
}
body {
	display: flex; flex-direction: column; align-items: center;
	padding: 10px 10px 14px;
}
header {
	width: 100%; max-width: 980px;
	display: flex; align-items: center; gap: 10px;
	flex-wrap: wrap; margin-bottom: 8px;
}
h1 {
	font: 700 20px/1 Georgia, "Times New Roman", serif;
	margin: 0 auto 0 2px; letter-spacing: .5px;
}
h1 span { color: var(--accent); }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
button {
	font: 500 13px/1 inherit;
	color: var(--ink); background: var(--panel-2);
	border: 1px solid var(--line); border-radius: 6px;
	padding: 7px 12px; cursor: pointer;
	transition: background .12s, border-color .12s;
}
button:hover:not(:disabled) { background: #313142; border-color: #4a4a66; }
button:disabled { opacity: .45; cursor: default; }
.row button:first-child {
	background: var(--accent); color: var(--accent-ink);
	border-color: var(--accent); font-weight: 600;
}
.row button:first-child:hover { background: #f4b757; }

#field-wrap { position: relative; line-height: 0; }
canvas {
	display: block; border-radius: 8px;
	border: 1px solid var(--line);
	background: #1a1a22;
	touch-action: none;
	box-shadow: 0 8px 28px rgba(0,0,0,.45);
}
#status {
	width: 100%; max-width: 980px;
	margin-top: 10px; padding: 9px 12px;
	background: var(--panel); border: 1px solid var(--line);
	border-radius: 6px;
	font: 13px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	color: #cfcfe4; text-align: center;
	white-space: pre-wrap;
}
#hint {
	max-width: 980px; margin-top: 8px;
	font-size: 12px; color: var(--muted); text-align: center;
}

#overlay {
	position: absolute; inset: 0;
	display: none; align-items: center; justify-content: center;
	background: rgba(10,10,16,.76);
	border-radius: 8px; padding: 16px;
	backdrop-filter: blur(2px);
}
#overlay.show { display: flex; }
#overlay-body {
	background: var(--panel); border: 1px solid var(--line);
	border-radius: 10px; padding: 18px 20px;
	max-width: 440px; max-height: 100%; overflow: auto;
	line-height: 1.5; font-size: 13.5px;
	box-shadow: 0 10px 40px rgba(0,0,0,.5);
}
#overlay-body h2 {
	margin: 0 0 10px; font: 700 18px/1.2 Georgia, serif;
	color: var(--accent);
}
#overlay-body p { margin: 8px 0; }
#overlay-body ul { margin: 8px 0; padding-left: 20px; }
#overlay-body li { margin: 6px 0; }
#overlay-body .big { font-size: 16px; font-weight: 600; }
#overlay-body .muted, .muted { color: var(--muted); }
#overlay-body input {
	width: 100%; padding: 8px 10px; margin-top: 4px;
	background: #14141c; color: var(--ink);
	border: 1px solid var(--line); border-radius: 6px;
	font: 14px/1 inherit;
}
#overlay-body .row {
	display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
}
table.scores { width: 100%; border-collapse: collapse; margin-top: 6px; }
table.scores th, table.scores td {
	padding: 5px 8px; text-align: left; font-size: 13px;
	border-bottom: 1px solid var(--line);
}
table.scores th { color: var(--muted); font-weight: 500; }
table.scores tr.hl td { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<header>
	<h1>X<span>Bill</span></h1>
	<nav>
		<button id="btn-new">New game</button>
		<button id="btn-pause">Pause</button>
		<button id="btn-level">Level</button>
		<button id="btn-scores">Scores</button>
		<button id="btn-help">How to play</button>
		<button id="btn-about">About</button>
	</nav>
</header>

<div id="field-wrap">
	<canvas id="field" width="800" height="800"></canvas>
	<div id="overlay"><div id="overlay-body"></div></div>
</div>

<div id="status"></div>
<div id="hint">Click the Bills. Drag dropped operating systems back onto
compatible machines. Drag the bucket onto sparks.</div>

<script src="src/engine.js"></script>
<script src="src/sprites.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
