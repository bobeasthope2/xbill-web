<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>XBill</title>
<style>
:root {
	--bg: #14141a;
	--panel: #1e1e28;
	--panel-2: #262633;
	--line: #35354a;
	--ink: #e8e8f2;
	--muted: #9a9ab4;
	--accent: #e8a33d;
	--accent-ink: #1a1a22;
}
* { box-sizing: border-box; }
html, body {
	margin: 0; padding: 0; height: 100%;
	background: var(--bg); color: var(--ink);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	-webkit-font-smoothing: antialiased;
	overscroll-behavior: none;
}
body {
	display: flex; flex-direction: column; align-items: center;
	padding: 10px 10px 14px;
}
header {
	width: 100%; max-width: 980px;
	display: flex; align-items: center; gap: 10px;
	flex-wrap: wrap; margin-bottom: 8px;
}
h1 {
	font: 700 20px/1 Georgia, "Times New Roman", serif;
	margin: 0 auto 0 2px; letter-spacing: .5px;
}
h1 span { color: var(--accent); }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
button {
	font: 500 13px/1 inherit;
	color: var(--ink); background: var(--panel-2);
	border: 1px solid var(--line); border-radius: 6px;
	padding: 7px 12px; cursor: pointer;
	transition: background .12s, border-color .12s;
}
button:hover:not(:disabled) { background: #313142; border-color: #4a4a66; }
button:disabled { opacity: .45; cursor: default; }
.row button:first-child {
	background: var(--accent); color: var(--accent-ink);
	border-color: var(--accent); font-weight: 600;
}
.row button:first-child:hover { background: #f4b757; }

#field-wrap { position: relative; line-height: 0; }
canvas {
	display: block; border-radius: 8px;
	border: 1px solid var(--line);
	background: #1a1a22;
	touch-action: none;
	box-shadow: 0 8px 28px rgba(0,0,0,.45);
}
#status {
	width: 100%; max-width: 980px;
	margin-top: 10px; padding: 9px 12px;
	background: var(--panel); border: 1px solid var(--line);
	border-radius: 6px;
	font: 13px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	color: #cfcfe4; text-align: center;
	white-space: pre-wrap;
}
#hint {
	max-width: 980px; margin-top: 8px;
	font-size: 12px; color: var(--muted); text-align: center;
}

#overlay {
	position: absolute; inset: 0;
	display: none; align-items: center; justify-content: center;
	background: rgba(10,10,16,.76);
	border-radius: 8px; padding: 16px;
	backdrop-filter: blur(2px);
}
#overlay.show { display: flex; }
#overlay-body {
	background: var(--panel); border: 1px solid var(--line);
	border-radius: 10px; padding: 18px 20px;
	max-width: 440px; max-height: 100%; overflow: auto;
	line-height: 1.5; font-size: 13.5px;
	box-shadow: 0 10px 40px rgba(0,0,0,.5);
}
#overlay-body h2 {
	margin: 0 0 10px; font: 700 18px/1.2 Georgia, serif;
	color: var(--accent);
}
#overlay-body p { margin: 8px 0; }
#overlay-body ul { margin: 8px 0; padding-left: 20px; }
#overlay-body li { margin: 6px 0; }
#overlay-body .big { font-size: 16px; font-weight: 600; }
#overlay-body .muted, .muted { color: var(--muted); }
#overlay-body input {
	width: 100%; padding: 8px 10px; margin-top: 4px;
	background: #14141c; color: var(--ink);
	border: 1px solid var(--line); border-radius: 6px;
	font: 14px/1 inherit;
}
#overlay-body .row {
	display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
}
table.scores { width: 100%; border-collapse: collapse; margin-top: 6px; }
table.scores th, table.scores td {
	padding: 5px 8px; text-align: left; font-size: 13px;
	border-bottom: 1px solid var(--line);
}
table.scores th { color: var(--muted); font-weight: 500; }
table.scores tr.hl td { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<header>
	<h1>X<span>Bill</span></h1>
	<nav>
		<button id="btn-new">New game</button>
		<button id="btn-pause">Pause</button>
		<button id="btn-level">Level</button>
		<button id="btn-scores">Scores</button>
		<button id="btn-help">How to play</button>
		<button id="btn-about">About</button>
	</nav>
</header>

<div id="field-wrap">
	<canvas id="field" width="800" height="800"></canvas>
	<div id="overlay"><div id="overlay-body"></div></div>
</div>

<div id="status"></div>
<div id="hint">Click the Bills. Drag dropped operating systems back onto
compatible machines. Drag the bucket onto sparks.</div>

<script>
/* ===== src/engine.js ===== */
/*
 * XBill — web port of the engine.
 *
 * SPDX-License-Identifier: GPL-2.0-or-later
 *
 * Part of xbill-web, a browser port of XBill 2.1 by Brian Wellington and
 * Matias Duarte, Copyright 1994-2001.  Original is GPL-2.0-or-later;
 * this derivative work is distributed under the same terms.
 *
 * This is a deliberately literal translation of XBill 2.1 (Brian Wellington /
 * Matias Duarte, GPLv2).  Every rule, constant, hitbox and arithmetic quirk is
 * carried over from the C.  Where the C relies on integer division or C-style
 * truncation the JS uses Math.trunc / idiv so the numbers match exactly.
 *
 * Source file each section came from is noted in the banner comments.
 *
 * No DOM access anywhere in here: the engine runs headless under Node for the
 * simulation harness, and the browser layer only reads its state to draw.
 */
(function (root, factory) {
	if (typeof module === 'object' && module.exports)
		module.exports = factory();
	else
		root.XBillEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
'use strict';

/* ------------------------------------------------------------------ util.h */

/* C integer division truncates toward zero; so does Math.trunc. */
function idiv(a, b) { return Math.trunc(a / b); }

/*
 * mulberry32 — seeded so a simulation can be replayed exactly.  The original
 * used rand(); we only need *a* uniform source, not glibc's specific one.
 */
function mulberry32(a) {
	return function () {
		a |= 0; a = (a + 0x6D2B79F5) | 0;
		let t = Math.imul(a ^ (a >>> 15), 1 | a);
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	};
}

/* ------------------------------------------------------------- dimensions */
/*
 * Taken from the .xpm headers in the original pixmaps/ directory.  The engine
 * works in this 400x400 logical space regardless of how large we draw it, so
 * the gameplay balance is identical to stock xbill.
 */
const LOGIC_SIZE   = 400;
const TICK_MS      = 200;	/* UI.c: methods->start_timer(200) */

const COMPUTER_W   = 55,  COMPUTER_H = 45;	/* maccpu.xpm et al */
const OS_W         = 28,  OS_H       = 24;	/* wingdows.xpm et al */
const BILL_W       = 24,  BILL_H     = 38;	/* billD_0.xpm */
const SPARK_W      = 20,  SPARK_H    = 20;	/* spark_0.xpm */
const BUCKET_W     = 24,  BUCKET_H   = 24;	/* bucket.xpm */

/* ------------------------------------------------------------------- OS.c */

const OS_WINGDOWS = 0;
const OS_OFF      = -1;
const OS_MIN_PC   = 6;		/* OS.c: MIN_PC — os index >= 6 is a PC OS */

const OS_NAMES = ['wingdows', 'apple', 'next', 'sgi', 'sun',
                  'palm', 'os2', 'bsd', 'linux', 'redhat', 'hurd'];
const NUM_OS = OS_NAMES.length;				/* 11 */

/* -------------------------------------------------------------- Computer.c */

const COMPUTER_TOASTER = 0;
const CPU_MIN_PC = 6;		/* Computer.c: MIN_PC — type >= 6 is a PC */

const CPU_NAMES = ['toaster', 'maccpu', 'nextcpu', 'sgicpu',
                   'suncpu', 'palmcpu', 'os2cpu', 'bsdcpu'];
const NUM_SYS = CPU_NAMES.length;			/* 8 */

const OS_OFFSET = 4;		/* offset of the OS icon inside the screen */

/* ------------------------------------------------------------------ Bill.c */

const BILL_STATE_IN    = 1;
const BILL_STATE_AT    = 2;
const BILL_STATE_OUT   = 3;
const BILL_STATE_DYING = 4;
const BILL_STATE_STRAY = 5;

const BILL_OFFSET_X = 20;
const BILL_OFFSET_Y = 3;

const GRAVITY = 3;
const SLOW = 0, FAST = 1;
const WCELS = 4, DCELS = 5, ACELS = 13;

/* ----------------------------------------------------------------- Spark.h */

const SPARK_SPEED = 4;

/* ------------------------------------------------------------------ Game.c */

const STATE_PLAYING = 1;
const STATE_BETWEEN = 2;
const STATE_END     = 3;
const STATE_WAITING = 4;

const SCORE_BILLPOINTS = 5;

/* ----------------------------------------------------------------- Horde.c */

const MAX_BILLS = 100;

/* --------------------------------------------------------------- Network.c */

const STD_MAX_COMPUTERS = 20;

/* ======================================================================== */

class Engine {
	/*
	 * opts.seed       — rng seed (defaults to a time seed)
	 * opts.screensize — the original's --size option.  Leave at 400 for
	 *                   stock balance; larger values scale the number of
	 *                   bills and computers by (size/400)^2 exactly as
	 *                   Game_scale(2) does.
	 * opts.randInt    — optional replacement for C's rand(): returns a
	 *                   non-negative 31-bit int.  The differential test
	 *                   passes glibc's generator in here so the JS and the
	 *                   original C consume an identical random stream.
	 */
	constructor(opts) {
		opts = opts || {};
		this.screensize = opts.screensize || LOGIC_SIZE;
		this.seed = (opts.seed === undefined)
			? (Date.now() & 0x7fffffff) : (opts.seed | 0);
		if (opts.randInt) {
			this.randInt = opts.randInt;
		} else {
			const rng = mulberry32(this.seed);
			this.randInt = () => Math.floor(rng() * 2147483648);
		}

		this.state = STATE_WAITING;
		this.score = 0;
		this.level = 0;
		this.iteration = 0;
		this.efficiency = 0;

		this.computers = [];
		this.cables = [];
		this.alive = [];	/* index 0 is the C list head */
		this.strays = [];

		/* Horde counters */
		this.billsOn = 0;
		this.billsOff = 0;
		/* Network counters */
		this.sysBase = 0;	/* running their own OS */
		this.sysOff = 0;	/* powered off */
		this.sysWin = 0;	/* infected */

		this.grabbed = null;	/* stray OS held by the cursor */
		this.bucketGrabbed = false;

		this.events = [];
		this._billSeq = 0;
	}

	/*
	 * util.h: RAND(lb, ub) == rand() % ((ub) - (lb) + 1) + (lb).
	 * Expressed with the same modulo the C uses — including its slight
	 * low-end bias — so a shared integer stream yields identical draws.
	 */
	rand(lb, ub) {
		return (this.randInt() % (ub - lb + 1)) + lb;
	}

	/* Game.c: Game_scale */
	scale(dimensions) {
		const s = this.screensize / LOGIC_SIZE;
		let d = 1;
		for (let i = dimensions; i > 0; i--) d *= s;
		return d;
	}

	/* UI.c: UI_intersect */
	static intersect(x1, y1, w1, h1, x2, y2, w2, h2) {
		return Math.abs(x2 - x1 + idiv(w2 - w1, 2)) < idiv(w1 + w2, 2) &&
		       Math.abs(y2 - y1 + idiv(h2 - h1, 2)) < idiv(h1 + h2, 2);
	}

	/* =============================================== Game.c: lifecycle === */

	/* Game.c: setup_level */
	setupLevel(newlevel) {
		this.level = newlevel;
		this.hordeSetup();
		this.grabbed = null;
		this.bucketGrabbed = false;
		this.networkSetup();
		this.iteration = 0;
		this.efficiency = 0;
	}

	/* Game.c: Game_start */
	start(newlevel) {
		this.state = STATE_PLAYING;
		this.score = 0;
		this.setupLevel(newlevel);
	}

	/* Game.c: Game_warp_to_level */
	warpToLevel(lev) {
		if (this.state === STATE_PLAYING) {
			if (lev <= this.level) return;
			this.setupLevel(lev);
		} else {
			if (lev <= 0) return;
			this.start(lev);
		}
	}

	/* ================================================ Network.c =========== */

	/* Network.c: on() */
	numComputersFor(level) {
		const normal = Math.min(8 + level, STD_MAX_COMPUTERS);
		return Math.trunc(normal * this.scale(2));
	}

	/* Network.c: Network_setup */
	networkSetup() {
		let n = this.numComputersFor(this.level);
		this.computers = [];
		for (let i = 0; i < n; i++) {
			const c = this.computerSetup(i);
			if (!c) {
				/*
				 * Network.c does `ncomputers = i - 1` here,
				 * which drops one more machine than it placed.
				 * Kept, but floored at 0 — the original would
				 * index a negative count.
				 */
				n = Math.max(i - 1, 0);
				this.computers.length = n;
				break;
			}
			this.computers.push(c);
		}
		this.sysOff = 0;
		this.sysBase = this.computers.length;
		this.sysWin = 0;

		const ncables = Math.min(this.level,
					 idiv(this.computers.length, 2));
		this.cables = [];
		for (let i = 0; i < ncables; i++)
			this.cables.push(this.cableSetup());
	}

	/* Network.c: Network_toasters */
	networkToasters() {
		for (const c of this.computers) {
			c.type = COMPUTER_TOASTER;
			c.os = OS_OFF;
		}
		this.cables = [];
	}

	/* Network.c: Network_clear_stray */
	networkClearStray(bill) {
		for (const c of this.computers)
			if (c.stray === bill) c.stray = null;
	}

	/* ================================================ Computer.c ========== */

	/* Computer.c: determineOS */
	determineOS(type) {
		if (type < CPU_MIN_PC) return type;
		return this.rand(OS_MIN_PC, NUM_OS - 1);	/* OS_randpc */
	}

	/* Computer.c: Computer_setup — returns null if placement failed */
	computerSetup(index) {
		const screensize = this.screensize;
		const border = idiv(screensize, 10);	/* BORDER(size) */
		let counter = 0, x, y, flag;
		do {
			if (++counter > 4000) return null;
			x = this.rand(border, screensize - border - COMPUTER_W);
			y = this.rand(border, screensize - border - COMPUTER_H);
			flag = true;
			/* twidth = width - BILL_OFFSET_X + Bill_width() */
			const twidth = COMPUTER_W - BILL_OFFSET_X + BILL_W;
			for (let j = 0; j < index && flag; j++) {
				const c = this.computers[j];
				if (Engine.intersect(x, y, twidth, COMPUTER_H,
						     c.x, c.y, twidth, COMPUTER_H))
					flag = false;
			}
		} while (!flag);

		const type = this.rand(1, NUM_SYS - 1);
		return {
			type,
			os: this.determineOS(type),
			x, y,
			busy: 0,
			stray: null,
		};
	}

	/*
	 * Computer.c: Computer_on.  Note this is NOT a plain bounding box —
	 * it is a +/- width, +/- height test around the top-left corner, so
	 * the drop target extends above and to the left of the machine.  That
	 * generosity is part of how the original plays, so it is preserved.
	 */
	static computerOn(computer, locx, locy) {
		return Math.abs(locx - computer.x) < COMPUTER_W &&
		       Math.abs(locy - computer.y) < COMPUTER_H;
	}

	/* Computer.c: Computer_compatible */
	static computerCompatible(computer, system) {
		return computer.type === system ||
		       (computer.type >= CPU_MIN_PC && system >= OS_MIN_PC);
	}

	/* ================================================ Cable.c ============= */

	/* Cable.c: Cable_setup */
	cableSetup() {
		const n = this.computers.length;
		const c1 = this.rand(0, n - 1);
		let c2;
		do { c2 = this.rand(0, n - 1); } while (c2 === c1);

		const comp1 = this.computers[c1], comp2 = this.computers[c2];
		return {
			c1, c2,
			x1: comp1.x + idiv(COMPUTER_W, 3),
			y1: comp1.y + idiv(COMPUTER_H, 2),
			x2: comp2.x + idiv(COMPUTER_W, 3),
			y2: comp2.y + idiv(COMPUTER_H, 2),
			x: 0, y: 0, fx: 0, fy: 0,
			px: 0, py: 0,	/* render-only: previous spark pos */
			/*
			 * delay is assigned by the original but never read —
			 * SPARK_DELAY is dead code in 2.1 and sparks launch
			 * immediately.  Mirrored so behaviour matches.
			 */
			delay: Math.max(20 - this.level, 0),
			active: 0,
			index: 0,
		};
	}

	static cableReverse(cable) {
		let t;
		t = cable.c1; cable.c1 = cable.c2; cable.c2 = t;
		t = cable.x1; cable.x1 = cable.x2; cable.x2 = t;
		t = cable.y1; cable.y1 = cable.y2; cable.y2 = t;
	}

	/* Cable.c: Cable_update */
	cableUpdate(cable) {
		let comp1 = this.computers[cable.c1];
		let comp2 = this.computers[cable.c2];

		if (cable.active) {
			if ((comp1.os === OS_WINGDOWS) === (comp2.os === OS_WINGDOWS)) {
				cable.active = 0;
			} else if (comp1.os === OS_WINGDOWS || comp2.os === OS_WINGDOWS) {
				if (comp2.os === OS_WINGDOWS) {
					Engine.cableReverse(cable);
					comp1 = this.computers[cable.c1];
					comp2 = this.computers[cable.c2];
				}

				let xdist = cable.x2 - cable.x;
				let ydist = cable.y2 - cable.y;
				const sx = xdist >= 0 ? 1.0 : -1.0;
				const sy = ydist >= 0 ? 1.0 : -1.0;
				xdist = Math.abs(xdist);
				ydist = Math.abs(ydist);

				if (xdist === 0 && ydist === 0) {
					if (!comp2.busy) {
						if (comp2.os === OS_OFF)
							this.sysOff--;
						else
							this.sysBase--;
						this.sysWin++;
						comp2.os = OS_WINGDOWS;
					}
					cable.active = 0;
				} else if (Math.max(xdist, ydist) < SPARK_SPEED) {
					cable.x = cable.x2;
					cable.y = cable.y2;
				} else {
					/* float accumulate, int snapshot */
					cable.fx += (xdist * SPARK_SPEED * sx) / (xdist + ydist);
					cable.fy += (ydist * SPARK_SPEED * sy) / (xdist + ydist);
					cable.x = Math.trunc(cable.fx);
					cable.y = Math.trunc(cable.fy);
				}
				cable.index = 1 - cable.index;
			}
		} else {
			if ((comp1.os === OS_WINGDOWS) === (comp2.os === OS_WINGDOWS)) {
				/* nothing */
			} else if (comp1.os === OS_WINGDOWS || comp2.os === OS_WINGDOWS) {
				cable.active = 1;
				cable.delay = Math.max(20 - this.level, 0);
				if (comp2.os === OS_WINGDOWS)
					Engine.cableReverse(cable);
				cable.x = cable.x1;
				cable.fx = cable.x1;
				cable.y = cable.y1;
				cable.fy = cable.y1;
			}
		}
	}

	/* Cable.c: Cable_onspark */
	static cableOnSpark(cable, locx, locy) {
		if (!cable.active) return false;
		return Math.abs(locx - cable.x) < SPARK_W &&
		       Math.abs(locy - cable.y) < SPARK_H;
	}

	/* ================================================ Bill.c ============== */

	/* Bill.c: get_border — returns a point just off one of the four edges */
	getBorder() {
		const i = this.rand(0, 3);
		const screensize = this.screensize;
		let x = 0, y = 0;

		if (i % 2 === 0) x = this.rand(0, screensize - BILL_W);
		else             y = this.rand(0, screensize - BILL_H);

		switch (i) {
			case 0: y = -BILL_H - 16; break;
			case 1: x = screensize + 1; break;
			case 2: y = screensize + 1; break;
			case 3: x = -BILL_W - 2; break;
		}
		return { x, y };
	}

	/* Bill.c: Bill_enter */
	billEnter() {
		const pos = this.getBorder();
		const target_c = this.rand(0, this.computers.length - 1);
		const computer = this.computers[target_c];

		const bill = {
			id: ++this._billSeq,
			state: BILL_STATE_IN,
			index: 0,
			cels: 'L',		/* which animation strip */
			x: pos.x, y: pos.y,
			target_x: computer.x + COMPUTER_W - BILL_OFFSET_X,
			target_y: computer.y + BILL_OFFSET_Y,
			target_c,
			cargo: OS_WINGDOWS,
			x_offset: -2,
			y_offset: -15,
			sx: 0, sy: 0,
			removed: false,
			/* render-only: previous position for interpolation */
			px: pos.x, py: pos.y,
		};
		this.billsOn++;
		this.billsOff--;
		return bill;
	}

	/* Bill.c: step_size */
	static stepSize(level) { return Math.min(11 + level, 15); }

	/* Bill.c: move — returns whether Bill actually moved */
	move(bill, mode) {
		let xdist = bill.target_x - bill.x;
		let ydist = bill.target_y - bill.y;
		const step = Engine.stepSize(this.level);
		const signx = xdist >= 0 ? 1 : -1;
		const signy = ydist >= 0 ? 1 : -1;
		xdist = Math.abs(xdist);
		ydist = Math.abs(ydist);

		if (!xdist && !ydist) return 0;

		if (xdist < step && ydist < step) {
			bill.x = bill.target_x;
			bill.y = bill.target_y;
		} else {
			/* C: int arithmetic, truncating division */
			let dx = idiv(xdist * step * signx, xdist + ydist);
			let dy = idiv(ydist * step * signy, xdist + ydist);
			if (mode === FAST) {
				/* C: int *= 1.25 — promote, multiply, truncate */
				dx = Math.trunc(dx * 1.25);
				dy = Math.trunc(dy * 1.25);
			}
			bill.x += dx;
			bill.y += dy;
			if (dx < 0) bill.cels = 'L';
			else if (dx > 0) bill.cels = 'R';
		}
		return 1;
	}

	/* Bill.c: update_in */
	updateIn(bill) {
		const moved = this.move(bill, SLOW);
		let computer = this.computers[bill.target_c];

		if (!moved && computer.os !== OS_WINGDOWS && !computer.busy) {
			computer.busy = 1;
			bill.cels = 'A';
			bill.index = 0;
			bill.state = BILL_STATE_AT;
			return;
		} else if (!moved) {
			/*
			 * The original loops until it draws a *different*
			 * computer, which spins forever with only one machine.
			 * Guarded here; behaviour is identical for n >= 2.

			const n = this.computers.length;
			if (n >= 2) {
				let i;
				do { i = this.rand(0, n - 1); }
				while (i === bill.target_c);
				computer = this.computers[i];
				bill.target_c = i;
				bill.target_x = computer.x + COMPUTER_W - BILL_OFFSET_X;
				bill.target_y = computer.y + BILL_OFFSET_Y;
			}
		}
		bill.index++;
		bill.index %= WCELS;
		bill.y_offset += (8 * (bill.index % 2) - 4);
	}

	/* Bill.c: update_at — the 13-frame OS theft animation */
	updateAt(bill) {
		const computer = this.computers[bill.target_c];

		if (bill.index === 0 && computer.os === OS_OFF) {
			bill.index = 6;
			if (computer.stray === null) {
				bill.cargo = -1;
			} else {

				this.hordeRemoveBill(computer.stray);
				computer.stray = null;

			bill.index++;

		if (bill.index === 13) {
			bill.y_offset = -15;
			bill.x_offset = -2;
			const b = this.getBorder();
			bill.target_x = b.x;
			bill.target_y = b.y;
			bill.index = 0;
			bill.cels = 'L';
			bill.state = BILL_STATE_OUT;
			computer.busy = 0;
			return;
		}

		bill.y_offset = BILL_H - OS_H;		/* 38 - 24 = 14 */

		case 2:

		case 3:
			bill.x -= 10; bill.x_offset += 10; break;
		case 4:
			bill.x += 3; bill.x_offset -= 3; break;
		case 5:
			bill.x += 2; bill.x_offset -= 2; break;
		case 6:

				this.sysOff++;

			bill.y_offset = -15;
			bill.x += 20; bill.x_offset -= 20;
			break;
		case 7:
			bill.sy = bill.y_offset; bill.sx = -2; break;
		case 8:
			bill.sy = -15; bill.sx = -2; break;
		case 9:
			bill.sy = -7; bill.sx = -7;
			bill.x -= 8; bill.x_offset += 8; break;
		case 10:
			bill.sy = 0; bill.sx = -7;
			bill.x -= 15; bill.x_offset += 15; break;
		case 11:
			bill.sy = 0; bill.sx = -7;
			computer.os = OS_WINGDOWS;

	/* Bill.c: update_out */
	updateOut(bill) {

			this.move(bill, FAST);

			case BILL_STATE_AT:    this.updateAt(bill); break;

		bill.y_offset = -15;

	/* Bill.c: Bill_clickedstray — stray hitbox is the OS icon, not Bill */
	static billClickedStray(bill, locx, locy) {

	/* Horde.c: on() */

	 * subtraction wraps to ~4.29e9, MAX compares unsigned and picks it,
	 * and the int return reinterprets it as a small negative number.
	 * The caller then does `iteration % between(level) == 0`, and since
	 * n % -1 is 0 for every n, Bills start launching on *every* tick
	 * instead of every 10.  Level 45 is where xbill falls off a cliff.
	 *

	 * fails without it.

	static between(level) {
		const wrapped = (14 - idiv(level, 3)) >>> 0;	/* unsigned */

	hordeUpdate(iteration) {

		 * Horde_update caches bill->next before calling Bill_update.
		 * That is unsafe in the original: update_at() claims a
		 * computer's stray and calls Horde_remove_bill() on it, which
		 * UNLINKs and free()s a Bill that may be exactly the cached
		 * next pointer — so the loop then walks freed memory and the
		 * rest of the list is updated or skipped depending on what the
		 * allocator left behind.
		 *
		 * This is the one place the port deliberately does NOT copy
		 * the original: reproducing a use-after-free is neither
		 * possible nor desirable.  We snapshot the list and skip any
		 * Bill removed mid-pass, which is what the C does whenever the
		 * freed memory happens to survive intact.
		 */
		const snapshot = this.alive.slice();
		for (const bill of snapshot) {
			if (bill.removed) continue;
			bill.px = bill.x; bill.py = bill.y;
			this.billUpdate(bill);

	hordeMoveBill(bill) {

		if (i >= 0) this.alive.splice(i, 1);
		this.strays.unshift(bill);
	}

	/* Horde.c: Horde_remove_bill */
	hordeRemoveBill(bill) {
		const list = (bill.state === BILL_STATE_STRAY)
			? this.strays : this.alive;

		if (i >= 0) list.splice(i, 1);
		bill.removed = true;
		this.networkClearStray(bill);

	hordeAddBill(bill) {

	hordeClickedStray(x, y) {

			const i = this.strays.indexOf(bill);
			this.strays.splice(i, 1);
			return bill;
		}
		return null;
	}

	/* Horde.c: Horde_process_click — kills every bill under the point */
	hordeProcessClick(x, y) {
		let counter = 0;
		for (const bill of this.alive) {
			if (bill.state === BILL_STATE_DYING ||
			    !Engine.billClicked(bill, x, y))
				continue;
			if (bill.state === BILL_STATE_AT) {

				comp.busy = 0;
				comp.stray = bill;

			Engine.billSetDying(bill);
			counter++;

	}

	/* ================================================ Bucket.c ============ */

	/* Bucket.c: Bucket_clicked */
	static bucketClicked(x, y) {
		return x > 0 && x < BUCKET_W && y > 0 && y < BUCKET_H;
	}

	/* Bucket.c: Bucket_release */
	bucketRelease(x, y) {
		for (const cable of this.cables)
			if (Engine.cableOnSpark(cable, x, y))
				this._cableReset(cable);

		cable.active = 0;

	/* Game.c: Game_button_press */
	buttonPress(x, y) {
		if (this.state !== STATE_PLAYING) return 0;

			this.bucketGrabbed = true;
			return 0;
		}

		this.grabbed = this.hordeClickedStray(x, y);
		if (this.grabbed !== null) return 0;

		const counter = this.hordeProcessClick(x, y);
		this.score += counter * counter * SCORE_BILLPOINTS;
		return counter;
	}

	/* Game.c: Game_button_release */
	buttonRelease(x, y) {
		if (this.state !== STATE_PLAYING) {
			this.bucketGrabbed = false;
			return false;
		}

		if (this.grabbed === null) {
			/*
			 * Note: the original routes *every* release with no
			 * held OS through Bucket_release, so clicking directly
			 * on a spark extinguishes it whether or not you picked
			 * the bucket up first.  Preserved.
			 */
			this.bucketRelease(x, y);
			return false;
		}

		const grabbed = this.grabbed;
		for (const computer of this.computers) {
			/*
			 * Note there is deliberately no `!computer.busy` test
			 * here, matching Game_button_release.  That means you
			 * may drop an OS onto a machine a Bill has already
			 * powered off mid-theft.  The Bill's animation then
			 * reaches frame 11 and does OFF--/WIN++ on a machine
			 * that is no longer off, so the three system counters
			 * drift from the real machine states: "running" reads
			 * one too high and "off" one too low each time, and
			 * "off" can even go negative on the status line.
			 *
			 * This is an xbill 2.1 bug, not a porting mistake —
			 * the original C drifts in exactly the same way (it
			 * shows up in roughly two thirds of long games).  It
			 * is kept because it is observable: an over-counted
			 * "running" total delays the base + off <= 1 game-over
			 * test, so removing it would make the endgame harder
			 * than the real thing.  The sum of the three counters
			 * always still equals the machine count.
			 */
			if (Engine.computerOn(computer, x, y) &&
			    Engine.computerCompatible(computer, grabbed.cargo) &&
			    (computer.os === OS_WINGDOWS || computer.os === OS_OFF)) {
				this.sysBase++;
				if (computer.os === OS_WINGDOWS) this.sysWin--;
				else this.sysOff--;
				computer.os = grabbed.cargo;
				this.hordeRemoveBill(grabbed);
				this.grabbed = null;
				return true;
			}
		}
		/* no valid target — the OS drops back where it was */
		this.hordeAddBill(grabbed);
		this.grabbed = null;
		return false;
	}

	/* ================================================ Game.c: update ====== */

	/* Game.c: update_info — the efficiency accumulator */
	updateInfo() {
		const units = this.computers.length;
		if (units <= 0) return;
		this.efficiency += idiv(100 * this.sysBase - 10 * this.sysWin,
					units);
	}

	/*
	 * Game.c: Game_update, minus the drawing.  Returns the events raised
	 * this tick so the caller can show dialogs / stop the clock.
	 */
	tick() {
		this.events = [];

		switch (this.state) {
		case STATE_PLAYING: {
			for (const cable of this.cables) {
				cable.px = cable.x; cable.py = cable.y;
				this.cableUpdate(cable);
			}
			this.hordeUpdate(this.iteration);
			this.updateInfo();

			if (this.billsOn + this.billsOff === 0) {
				if (this.iteration > 0)
					this.score += idiv(this.level * this.efficiency,
							   this.iteration);
				this.state = STATE_BETWEEN;
			}
			/*
			 * Checked after the level-clear test, so if both fire
			 * on the same tick the game-over wins — same as the C.
			 */
			if (this.sysBase + this.sysOff <= 1)
				this.state = STATE_END;
			break;
		}
		case STATE_END:
			this.networkToasters();
			this.events.push({ type: 'gameover',
					   level: this.level,
					   score: this.score });
			this.state = STATE_WAITING;
			break;

		case STATE_BETWEEN:
			this.events.push({ type: 'levelcomplete',
					   level: this.level,
					   score: this.score });
			this.state = STATE_PLAYING;
			this.setupLevel(this.level + 1);
			break;
		}

		this.iteration++;
		return this.events;
	}

	/* ------------------------------------------------ status line -------- */

	/* Game.c: update_info's sprintf */
	statusLine() {
		return `Bill:${this.billsOn}/${this.billsOff}  ` +
		       `System:${this.sysBase}/${this.sysOff}/${this.sysWin}  ` +
		       `Level:${this.level}  Score:${this.score}`;
	}

Engine.TICK_MS = TICK_MS;

/* 3 — SGI: the interlocking cube.  IRIX. */
OS_DRAW[3] = function (c) {
	c.fillStyle = '#a9c9e9';
	c.fillRect(0, 0, 28, 24);

	c.save();
	c.translate(14, 12);

	/* isometric cube — three visible faces, the SGI identity */
	const R = 9.2, HX = R * 0.866, HY = R * 0.5;
	const T = [0, -R], UR = [HX, -HY], LR = [HX, HY];
	const B = [0, R], LL = [-HX, HY], UL = [-HX, -HY], C = [0, 0];

	const face = (pts, fill) => {
		c.beginPath();
		c.moveTo(pts[0][0], pts[0][1]);
		for (let k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]);
		c.closePath();
		c.fillStyle = fill;
		c.fill();
		c.stroke();
	};

	c.lineWidth = 1.3;
	c.lineJoin = 'round';
	c.strokeStyle = '#223b5e';

	/* top face (lightest), then right, then left */
	face([T, UR, C, UL], '#eaf2fb');
	face([UR, LR, B, C], '#6f8db5');
	face([UL, C, B, LL], '#9fb6d2');
	c.restore();
};

/* 4 — Sun: interlocking lozenge "SUN".  Solaris. */
OS_DRAW[4] = function (c) {
	c.fillStyle = '#e2e0c2';
	c.fillRect(0, 0, 28, 24);

	c.save();
	c.translate(14, 12);
	c.rotate(Math.PI / 4);
	c.fillStyle = '#4a6ba8';
	c.strokeStyle = '#2d4878';
	c.lineWidth = 0.45;

	/* four interlocking bars = the classic woven diamond */
	const BW = 3.3, OFF = 3.5, LEN = 9.6;
	for (let i = 0; i < 2; i++) {
		const o = i ? OFF : -OFF;
		c.fillRect(-LEN, o - BW / 2, LEN * 2, BW);
		c.strokeRect(-LEN, o - BW / 2, LEN * 2, BW);
	}
	for (let i = 0; i < 2; i++) {
		const o = i ? OFF : -OFF;
		c.fillRect(o - BW / 2, -LEN, BW, LEN * 2);
		c.strokeRect(o - BW / 2, -LEN, BW, LEN * 2);
	}
	/* re-lay the horizontals at the crossings so the weave reads */
	c.fillStyle = '#5c7fbe';
	for (let i = 0; i < 2; i++) {
		const o = i ? OFF : -OFF;
		c.fillRect(-LEN, o - BW / 2, LEN - OFF - BW / 2, BW);
		c.fillRect(OFF + BW / 2, o - BW / 2, LEN - OFF - BW / 2, BW);
	}
	c.restore();
};

function drawOS(ctx, os, x, y) {
	const i = clampIdx(os, OS_DRAW.length);
	ctx.save();
	ctx.translate(x, y);
	ctx.textAlign = 'left';
	ctx.textBaseline = 'alphabetic';
	OS_DRAW[i](ctx);

/* ================================================== machines (55x45) ==== */

/*
 * Every desktop machine is a monitor whose screen occupies (4,4)-(32,28),
 * because the engine paints the 28x24 OS logo at offset (4,4).  Nothing that
 * identifies the machine may live inside that rectangle.
 */
const SCREEN_X = 4, SCREEN_Y = 4, SCREEN_W = 28, SCREEN_H = 24;

function monitor(c, bezel, bezelLit, bezelDark) {
	/* bezel */
	fillRR(c, 1, 1, 34, 31, 2.4, bezel);
	c.fillStyle = bezelLit;
	c.fillRect(2, 2, 32, 1.4);
	c.fillStyle = bezelDark;
	c.fillRect(2, 30.2, 32, 1.4);

	/* recessed screen */
	c.fillStyle = '#05050a';
	c.fillRect(SCREEN_X - 0.8, SCREEN_Y - 0.8, SCREEN_W + 1.6, SCREEN_H + 1.6);
	c.fillStyle = P.screen;
	c.fillRect(SCREEN_X, SCREEN_Y, SCREEN_W, SCREEN_H);

	/* stand + keyboard */
	c.fillStyle = bezelDark;
	c.fillRect(13, 32, 10, 2.2);
	fillRR(c, 2, 34.4, 32, 6.4, 1.2, bezel);
	c.fillStyle = bezelLit;
	c.fillRect(3, 35.2, 30, 0.9);
	c.fillStyle = bezelDark;
	for (let r = 0; r < 3; r++)
		for (let k = 0; k < 13; k++)
			c.fillRect(3.6 + k * 2.3, 36.5 + r * 1.35, 1.6, 0.85);
}

/* screen glow so a lit machine reads as "on" even before the OS is drawn */
function screenSheen(c) {
	c.save();
	c.globalAlpha = 0.14;
	const g = c.createLinearGradient(SCREEN_X, SCREEN_Y,
					 SCREEN_X + SCREEN_W, SCREEN_Y + SCREEN_H);
	g.addColorStop(0, '#ffffff');
	g.addColorStop(0.5, 'rgba(255,255,255,0)');
	c.fillStyle = g;
	c.fillRect(SCREEN_X, SCREEN_Y, SCREEN_W, SCREEN_H);
	c.restore();
}

	c.fillRect(42, 5, 2.6, 4);
};

/* 6 — OS/2 PC: beige mini-tower */
CPU_DRAW[6] = function (c) {
	monitor(c, P.beige, P.beigeLit, P.beigeDark);
	screenSheen(c);

	fillRR(c, 38, 10, 15, 26, 1.4, P.beige);
	c.fillStyle = P.beigeLit;
	c.fillRect(38.8, 10.8, 13.4, 1.1);
	c.fillStyle = '#8d8773';
	c.fillRect(40, 14, 11, 2.6);		/* 5.25" bay */
	c.fillRect(40, 18, 11, 1.9);		/* floppy */
	c.fillStyle = '#5f5a4c';
	c.fillRect(40.6, 18.5, 7, 0.9);
	c.fillStyle = P.led;
	c.fillRect(40, 22.5, 1.8, 1.5);
	c.fillStyle = '#9b9583';
	c.fillRect(40, 26, 11, 7);
	/* mouse */
	fillRR(c, 44, 38.4, 6, 4.4, 2, P.beigeLit);
};

/* 7 — BSD PC: tower with red/green LEDs */
CPU_DRAW[7] = function (c) {
	monitor(c, '#cfc9b2', '#e9e3cd', '#97927c');
	screenSheen(c);

	fillRR(c, 38, 6, 15, 30, 1.4, '#cfc9b2');
	c.fillStyle = '#e9e3cd';
	c.fillRect(38.8, 6.8, 13.4, 1.1);
	c.fillStyle = P.ledRed;
	c.fillRect(40, 10, 2.2, 1.9);
	c.fillStyle = P.led;
	c.fillRect(43.5, 10, 2.2, 1.9);
	c.fillStyle = '#8b8672';
	c.fillRect(40, 14, 11, 2.4);
	c.fillRect(40, 18, 11, 2.4);
	c.fillStyle = '#5f5a4c';
	for (let i = 0; i < 5; i++)
		c.fillRect(40, 23 + i * 2.3, 11, 1.2);
	/* mouse */
	fillRR(c, 44, 38.4, 6, 4.4, 2, '#e9e3cd');
};

function drawComputer(ctx, type, x, y) {
	const i = clampIdx(type, CPU_DRAW.length);
	ctx.save();
	ctx.translate(x, y);
	CPU_DRAW[i](ctx);
	ctx.restore();
}

/* ====================================================== Bill (24x38) ==== */

/*
 * Bill as the original drew him: blonde mop, oversized round glasses, smug
 * grin, pale suit and tie.  Front-facing; the walk cycle swings the legs,
 * and the direction strips mirror him.
 */
function billBody(c, lean, legPhase) {
	c.save();
	c.translate(12, 0);			/* centre line */
	c.scale(lean, 1);
	c.translate(-12, 0);

	/* legs */
	const swing = [0, 1.9, 0, -1.9][legPhase] || 0;
	c.fillStyle = P.suitShade;
	c.fillRect(8.4 + swing * 0.5, 27, 3.0, 7.5);
	c.fillRect(12.8 - swing * 0.5, 27, 3.0, 7.5);
	/* shoes */
	fillRR(c, 7.0 + swing, 33.8, 5.4, 2.9, 1.2, P.shoe);
	fillRR(c, 12.0 - swing, 33.8, 5.4, 2.9, 1.2, P.shoe);

	/* torso */
	c.fillStyle = P.suit;
	c.beginPath();
	c.moveTo(6.6, 27.6);
	c.lineTo(7.6, 17.6);
	c.quadraticCurveTo(12, 15.6, 16.4, 17.6);
	c.lineTo(17.4, 27.6);
	c.closePath();
	c.fill();

	/* lapels */
	c.fillStyle = P.suitShade;
	c.beginPath();
	c.moveTo(9.2, 16.8); c.lineTo(12, 22.4); c.lineTo(11.0, 16.4);
	c.closePath(); c.fill();
	c.beginPath();
	c.moveTo(14.8, 16.8); c.lineTo(12, 22.4); c.lineTo(13.0, 16.4);
	c.closePath(); c.fill();

	/* tie */
	c.fillStyle = P.tie;
	c.beginPath();
	c.moveTo(12, 17.2); c.lineTo(13.2, 19.0); c.lineTo(12, 25.4);
	c.lineTo(10.8, 19.0);
	c.closePath(); c.fill();

	/* arms */
	c.fillStyle = P.suit;
	c.fillRect(5.0 - swing * 0.4, 18.4, 2.6, 8.0);
	c.fillRect(16.4 + swing * 0.4, 18.4, 2.6, 8.0);
	c.fillStyle = P.skin;
	c.beginPath(); c.arc(6.3 - swing * 0.4, 27.0, 1.5, 0, Math.PI*2); c.fill();
	c.beginPath(); c.arc(17.7 + swing * 0.4, 27.0, 1.5, 0, Math.PI*2); c.fill();

	c.restore();
}

function billHead(c, lean) {
	c.save();
	c.translate(12, 0);
	c.scale(lean, 1);
	c.translate(-12, 0);

	/* face */
	c.fillStyle = P.skin;
	c.beginPath();
	c.ellipse(12, 10.2, 6.1, 6.8, 0, 0, Math.PI * 2);
	c.fill();
	c.fillStyle = P.skinShade;
	c.beginPath();
	c.ellipse(12, 15.0, 4.2, 2.2, 0, 0, Math.PI);
	c.fill();

	/* the mop */
	c.fillStyle = P.hair;
	c.beginPath();
	c.moveTo(5.7, 9.4);
	c.bezierCurveTo(5.2, 2.0, 11.0, 0.6, 14.4, 1.6);
	c.bezierCurveTo(18.4, 2.6, 18.8, 5.6, 18.3, 9.2);
	c.bezierCurveTo(17.6, 6.0, 16.2, 5.0, 13.2, 5.2);
	c.bezierCurveTo(9.4, 5.5, 7.0, 6.2, 5.7, 9.4);
	c.closePath();
	c.fill();
	c.fillStyle = P.hairLit;
	c.beginPath();
	c.moveTo(7.4, 4.6);
	c.quadraticCurveTo(11.2, 1.8, 15.0, 3.0);
	c.quadraticCurveTo(11.4, 3.2, 7.4, 4.6);
	c.closePath();
	c.fill();
	/* sideburns */
	c.fillStyle = P.hairDark;
	c.fillRect(5.6, 8.0, 1.5, 3.4);
	c.fillRect(16.9, 8.0, 1.5, 3.4);

	/* the glasses — oversized, the defining feature */
	c.fillStyle = P.lens;
	c.beginPath(); c.arc(9.0, 10.4, 3.25, 0, Math.PI * 2); c.fill();
	c.beginPath(); c.arc(15.0, 10.4, 3.25, 0, Math.PI * 2); c.fill();
	c.strokeStyle = P.ink;
	c.lineWidth = 0.85;
	c.beginPath(); c.arc(9.0, 10.4, 3.25, 0, Math.PI * 2); c.stroke();
	c.beginPath(); c.arc(15.0, 10.4, 3.25, 0, Math.PI * 2); c.stroke();
	c.beginPath();
	c.moveTo(12.25, 10.0); c.lineTo(11.75, 10.0);	/* bridge */
	c.moveTo(5.75, 10.0); c.lineTo(5.0, 9.6);	/* temples */
	c.moveTo(18.25, 10.0); c.lineTo(19.0, 9.6);
	c.stroke();

	/* eyes behind the lenses, narrowed — he is enjoying this */
	c.fillStyle = P.ink;
	c.beginPath(); c.ellipse(9.4, 10.7, 1.2, 0.95, 0, 0, Math.PI*2); c.fill();
	c.beginPath(); c.ellipse(14.6, 10.7, 1.2, 0.95, 0, 0, Math.PI*2); c.fill();

	/* brows, angled in: smug rather than cheerful */
	c.strokeStyle = P.ink;
	c.lineWidth = 0.75;
	c.beginPath();
	c.moveTo(6.6, 6.9); c.lineTo(11.0, 6.3);
	c.moveTo(13.0, 6.3); c.lineTo(17.4, 6.9);
	c.stroke();

	/* the smirk — lopsided, one corner hooked up */
	c.lineWidth = 0.8;
	c.beginPath();
	c.moveTo(9.2, 14.3);
	c.quadraticCurveTo(12.4, 16.5, 15.3, 13.1);
	c.stroke();
	c.lineWidth = 0.6;
	c.beginPath();
	c.moveTo(15.3, 13.1); c.lineTo(16.0, 12.4);
	c.stroke();

	c.restore();
}

function drawBillWalk(c, dir, index) {
	const lean = dir === 'R' ? -1 : 1;
	billBody(c, lean, index);
	billHead(c, lean);
}

/* Dying: glasses fly off, he ruptures, melts into a puddle. */
function drawBillDying(c, index) {
	const stage = clampIdx(index, 5);

	if (stage <= 1) {
		billBody(c, 1, 0);
		billHead(c, 1);
		/* glasses launching off */
		c.save();
		c.strokeStyle = P.ink;
		c.lineWidth = 0.8;
		c.fillStyle = P.lens;
		c.translate(3 + stage * 5, 4 - stage * 2.5);
		c.rotate(0.6 + stage);
		c.beginPath(); c.arc(-2.6, 0, 2.5, 0, Math.PI*2); c.fill(); c.stroke();
		c.beginPath(); c.arc(2.6, 0, 2.5, 0, Math.PI*2); c.fill(); c.stroke();
		c.restore();
	}

	if (stage >= 1) {
		/* arterial spray — id software eat your heart out */
		const spray = [
			[],
			[[12,16,4.5],[8,13,2.4],[16,13,2.4]],
			[[12,20,7.0],[6,15,3.4],[18,15,3.4],[12,11,3.0]],
			[[12,26,8.4],[5,22,3.6],[19,22,3.6]],
			[[12,32,8.0],[6,31,3.0],[18,31,3.0]],
		][stage] || [];
		c.fillStyle = P.blood;
		for (const s of spray) {
			c.beginPath();
			c.arc(s[0], s[1], s[2], 0, Math.PI * 2);
			c.fill();
		}
		/* splatter flecks */
		c.fillStyle = P.bloodDark;
		const n = 5 + stage * 3;
		for (let i = 0; i < n; i++) {
			const a = (i * 2.399) + stage;
			const r = 4 + (i % 5) * 2.2 + stage * 1.5;
			c.beginPath();
			c.arc(12 + Math.cos(a) * r,
			      16 + stage * 3 + Math.sin(a) * r * 0.7,
			      0.75, 0, Math.PI * 2);
			c.fill();
		}
	}

	if (stage >= 3) {
		/* the puddle */
		c.fillStyle = P.blood;
		c.beginPath();
		c.ellipse(12, 35, 5.5 + stage * 2.2, 2.0 + stage * 0.5,
			  0, 0, Math.PI * 2);
		c.fill();
	}
}

/*
 * At a computer: 58x41, feet pinned to a common baseline across all 13
 * frames so he does not jitter.  He reaches toward the machine, takes its
 * OS around frame 6, and installs the virus over frames 7-12.
 */
function drawBillAt(c, index) {
	const i = clampIdx(index, 13);

	/* reach: out at the start, retracting as he works */
	const reach = i <= 5 ? i / 5 : (i >= 7 ? (12 - i) / 5 : 1);
	const crouch = Math.sin(i / 12 * Math.PI) * 1.6;

	c.save();
	/* he stands on the right-hand side of the machine */
	c.translate(30, 3 + crouch);
	drawBillWalk(c, 'L', i % 2 ? 1 : 0);

	/* the reaching arm, over the top of the body */
	c.save();
	c.translate(12, 0);
	c.strokeStyle = P.suit;
	c.lineWidth = 2.6;
	c.lineCap = 'round';
	c.beginPath();
	c.moveTo(-6.0, 19.0);
	c.quadraticCurveTo(-11 - reach * 5, 19.5, -14 - reach * 7, 17.0);
	c.stroke();
	c.fillStyle = P.skin;
	c.beginPath();
	c.arc(-14.6 - reach * 7, 16.8, 1.7, 0, Math.PI * 2);
	c.fill();
	c.restore();
	c.restore();
}

function drawBill(ctx, strip, index, x, y) {
	ctx.save();
	ctx.translate(x, y);
	ctx.textAlign = 'left';
	ctx.textBaseline = 'alphabetic';

	if (strip === 'A') drawBillAt(ctx, index);
	else if (strip === 'D') drawBillDying(ctx, index);
	else drawBillWalk(ctx, strip === 'R' ? 'R' : 'L', clampIdx(index, 4));

	ctx.restore();
}

/* ================================================= spark / bucket ======= */

function drawSpark(ctx, index, x, y) {
	const i = clampIdx(index, 2);
	ctx.save();
	ctx.translate(x + 10, y + 10);
	ctx.rotate(i ? Math.PI / 5 : 0);

	const g = ctx.createRadialGradient(0, 0, 0.5, 0, 0, 9);
	g.addColorStop(0, '#ffffff');
	g.addColorStop(0.35, '#ffef6a');
	g.addColorStop(0.7, 'rgba(255,150,20,.75)');
	g.addColorStop(1, 'rgba(255,90,0,0)');
	ctx.fillStyle = g;
	ctx.beginPath();
	ctx.arc(0, 0, 9, 0, Math.PI * 2);
	ctx.fill();

	/* spikes */
	ctx.fillStyle = '#fffbe0';
	const spikes = i ? 6 : 5;
	for (let k = 0; k < spikes; k++) {
		ctx.save();
		ctx.rotate((k / spikes) * Math.PI * 2);
		ctx.beginPath();
		ctx.moveTo(0, -1.6);
		ctx.lineTo(8.6, 0);
		ctx.lineTo(0, 1.6);
		ctx.closePath();
		ctx.fill();
		ctx.restore();
	}

	ctx.fillStyle = '#ffffff';
	ctx.beginPath();
	ctx.arc(0, 0, 2.3, 0, Math.PI * 2);
	ctx.fill();
	ctx.restore();
}

function drawBucket(ctx, x, y) {
	ctx.save();
	ctx.translate(x, y);

	/* handle */
	ctx.strokeStyle = '#9aa0ac';
	ctx.lineWidth = 1.1;
	ctx.beginPath();
	ctx.arc(12, 7.5, 7.2, Math.PI, Math.PI * 2);
	ctx.stroke();

	/* pail */
	ctx.beginPath();
	ctx.moveTo(3.6, 7.5);
	ctx.lineTo(20.4, 7.5);
	ctx.lineTo(18.2, 22.6);
	ctx.lineTo(5.8, 22.6);
	ctx.closePath();
	const g = ctx.createLinearGradient(3.6, 0, 20.4, 0);
	g.addColorStop(0, '#6f7682');
	g.addColorStop(0.35, '#c3cad6');
	g.addColorStop(1, '#6f7682');
	ctx.fillStyle = g;
	ctx.fill();
	ctx.strokeStyle = '#4b515c';
	ctx.lineWidth = 0.7;
	ctx.stroke();

	/* water */
	ctx.fillStyle = '#3f9fe0';
	ctx.beginPath();
	ctx.ellipse(12, 8.4, 8.0, 2.3, 0, 0, Math.PI * 2);
	ctx.fill();
	ctx.fillStyle = 'rgba(255,255,255,.5)';
	ctx.beginPath();
	ctx.ellipse(9.4, 7.9, 3.0, 0.95, -0.2, 0, Math.PI * 2);
	ctx.fill();

	/* rim */
	ctx.strokeStyle = '#dde3ea';
	ctx.lineWidth = 1.0;
	ctx.beginPath();
	ctx.ellipse(12, 7.5, 8.4, 2.5, 0, 0, Math.PI * 2);
	ctx.stroke();
	ctx.restore();
}

/* ==================================================== cable / field ===== */

function drawCable(ctx, x1, y1, x2, y2) {
	ctx.save();
	ctx.lineCap = 'round';
	ctx.strokeStyle = P.cable;
	ctx.lineWidth = 2.1;
	ctx.beginPath();
	ctx.moveTo(x1, y1);
	ctx.lineTo(x2, y2);
	ctx.stroke();

	ctx.strokeStyle = P.cableLit;
	ctx.lineWidth = 0.7;
	ctx.beginPath();
	ctx.moveTo(x1, y1 - 0.5);
	ctx.lineTo(x2, y2 - 0.5);
	ctx.stroke();
	ctx.restore();
}

function drawBackground(ctx, w, h) {
	ctx.save();
	const g = ctx.createLinearGradient(0, 0, 0, h);
	g.addColorStop(0, P.bg0);
	g.addColorStop(1, P.bg1);
	ctx.fillStyle = g;
	ctx.fillRect(0, 0, w, h);

	/* faint grid, like a machine-room floor */
	ctx.strokeStyle = 'rgba(255,255,255,.028)';
	ctx.lineWidth = 0.5;
	ctx.beginPath();
	for (let x = 20; x < w; x += 20) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
	for (let y = 20; y < h; y += 20) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
	ctx.stroke();

	/* vignette keeps the eye on the middle of the field */
	const v = ctx.createRadialGradient(w / 2, h / 2, h * 0.3,
					   w / 2, h / 2, h * 0.78);
	v.addColorStop(0, 'rgba(0,0,0,0)');
	v.addColorStop(1, 'rgba(0,0,0,.42)');
	ctx.fillStyle = v;
	ctx.fillRect(0, 0, w, h);
	ctx.restore();
}

return {
	drawComputer,
	drawOS,
	drawBill,
	drawSpark,
	drawBucket,
	drawCable,
	drawBackground,
	palette: P,
};
});

</script>
<script>
/* ===== src/ui.js ===== */
/*
 * Browser front end.
 *
 * SPDX-License-Identifier: GPL-2.0-or-later
 *
 * Part of xbill-web, a browser port of XBill 2.1 by Brian Wellington and
 * Matias Duarte, Copyright 1994-2001.  Original is GPL-2.0-or-later;
 * this derivative work is distributed under the same terms.
 *
 * The engine ticks at the original's 5Hz (200ms).  Rendering runs at display
 * rate and interpolates between the last two logic positions, so the motion
 * is smooth without altering a single rule — every decision the game makes
 * still happens on the 200ms boundary, exactly as in xbill 2.1.
 */
(function () {
'use strict';

const Engine = window.XBillEngine;
const Sprites = window.XBillSprites;

const LOGIC = Engine.LOGIC_SIZE;		/* 400x400 play field */
const TICK_MS = Engine.TICK_MS;			/* 200ms */

/* ------------------------------------------------------------- elements */

const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const overlayEl = document.getElementById('overlay');
const overlayBody = document.getElementById('overlay-body');

/* ----------------------------------------------------------------- state */

let game = null;
let running = false;
let paused = false;
let lastTick = 0;
let scale = 2;
let renderScale = 2;		/* canvas backing-store multiplier */
let mouse = { x: -100, y: -100, inside: false, down: false };

/* ------------------------------------------------------------ high scores */

const SCORE_KEY = 'xbill.highscores.v1';

function loadScores() {
	try {
		const raw = localStorage.getItem(SCORE_KEY);
		const list = raw ? JSON.parse(raw) : [];
		return Array.isArray(list) ? list : [];
	} catch (e) {
		return [];
	}
}

function saveScore(name, level, score) {
	const list = loadScores();
	list.push({ name, level, score });
	list.sort((a, b) => b.score - a.score);
	list.length = Math.min(list.length, 10);
	try {
		localStorage.setItem(SCORE_KEY, JSON.stringify(list));
	} catch (e) {
		/* private browsing — scores just won't persist */
	}
	return list;
}

function isHighScore(score) {
	const list = loadScores();
	return score > 0 && (list.length < 10 || score > list[list.length - 1].score);
}

function scoreTable(list, highlightIdx) {
	if (!list.length) return '<p class="muted">No scores yet.</p>';
	let h = '<table class="scores"><tr><th>#</th><th>Name</th>' +
		'<th>Level</th><th>Score</th></tr>';
	list.forEach((s, i) => {
		const cls = i === highlightIdx ? ' class="hl"' : '';
		h += `<tr${cls}><td>${i + 1}</td><td>${escapeHtml(s.name)}</td>` +
		     `<td>${s.level}</td><td>${s.score}</td></tr>`;
	});
	return h + '</table>';
}

function escapeHtml(s) {
	return String(s).replace(/[&<>"']/g, c => ({
		'&': '&amp;', '<': '&lt;', '>': '&gt;',
		'"': '&quot;', "'": '&#39;',
	}[c]));
}

/* ---------------------------------------------------------------- sizing */

function resize() {
	/*
	 * Measure the viewport, not #field-wrap: the wrap is shrink-to-fit
	 * inside a flex column, so its width is the canvas width and reading
	 * it back would be circular (and would pin the board at its minimum).
	 */
	const availW = Math.min(document.body.clientWidth - 24, 980);
	const availH = window.innerHeight - 190;
	scale = Math.max(1, Math.min(3.2, Math.min(availW, availH) / LOGIC));

	/*
	 * Supersample to at least 2x regardless of devicePixelRatio.  The art
	 * is vector and the scene is small, so the extra fill costs little and
	 * it keeps edges clean on ordinary 1x displays.
	 */
	renderScale = Math.max(window.devicePixelRatio || 1, 2);
	const cssSize = Math.round(LOGIC * scale);
	canvas.style.width = cssSize + 'px';
	canvas.style.height = cssSize + 'px';
	canvas.width = Math.round(cssSize * renderScale);
	canvas.height = Math.round(cssSize * renderScale);
	render(1);
}

/* Convert a pointer event to the engine's 400x400 logical coordinates. */
function toLogical(evt) {
	const r = canvas.getBoundingClientRect();
	const src = evt.touches && evt.touches.length ? evt.touches[0]
		: (evt.changedTouches && evt.changedTouches.length
			? evt.changedTouches[0] : evt);
	return {
		x: Math.round((src.clientX - r.left) / r.width * LOGIC),
		y: Math.round((src.clientY - r.top) / r.height * LOGIC),
	};
}

/* --------------------------------------------------------------- drawing */

/*
 * Interpolate a sprite's position between its previous and current logic
 * positions.  A large jump means it teleported (spawned, retargeted, or was
 * knocked down) so we snap instead of sliding it across the screen.
 */
const SNAP_DIST = 60;

function lerpPos(px, py, x, y, a) {
	if (Math.abs(x - px) > SNAP_DIST || Math.abs(y - py) > SNAP_DIST)
		return { x, y };
	return { x: px + (x - px) * a, y: py + (y - py) * a };
}

function render(alpha) {
	const s = scale * renderScale;
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.clearRect(0, 0, canvas.width, canvas.height);
	ctx.setTransform(s, 0, 0, s, 0, 0);
	ctx.imageSmoothingEnabled = true;

	Sprites.drawBackground(ctx, LOGIC, LOGIC);

	if (!game) {
		drawIdleBanner();
		return;
	}

	/* cables and their sparks sit under the machines */
	for (const cable of game.cables) {
		Sprites.drawCable(ctx, cable.x1, cable.y1, cable.x2, cable.y2);
		if (cable.active) {
			const p = lerpPos(cable.px, cable.py,
					  cable.x, cable.y, alpha);
			Sprites.drawSpark(ctx, cable.index,
					  p.x - Engine.SPARK_W / 2,
					  p.y - Engine.SPARK_H / 2);
		}
	}

	for (const c of game.computers) {
		Sprites.drawComputer(ctx, c.type, c.x, c.y);
		if (c.os !== Engine.OS_OFF)
			Sprites.drawOS(ctx, c.os,
				       c.x + Engine.OS_OFFSET,
				       c.y + Engine.OS_OFFSET);
	}

	/* dropped operating systems lying on the floor */
	for (const b of game.strays)
		Sprites.drawOS(ctx, b.cargo, b.x, b.y);

	for (const b of game.alive)
		drawBill(b, alpha);

	if (!game.bucketGrabbed)
		Sprites.drawBucket(ctx, 0, 0);

	drawCursorCargo();
}

function drawBill(b, alpha) {
	const S = Engine;

	if (b.state === S.BILL_STATE_AT) {
		/* Bill.c draw_at: the animation frame is pinned to the machine */
		const comp = game.computers[b.target_c];
		if (!comp) return;
		if (b.index > 6 && b.index < 12)
			Sprites.drawOS(ctx, 0, b.x + b.sx, b.y + b.sy);
		if (b.cargo >= 0)
			Sprites.drawOS(ctx, b.cargo,
				       b.x + b.x_offset, b.y + b.y_offset);
		Sprites.drawBill(ctx, 'A', b.index, comp.x, comp.y);
		return;
	}

	const p = lerpPos(b.px, b.py, b.x, b.y, alpha);
	if (b.cargo >= 0)
		Sprites.drawOS(ctx, b.cargo, p.x + b.x_offset, p.y + b.y_offset);

	const strip = b.state === S.BILL_STATE_DYING ? 'D' : b.cels;
	Sprites.drawBill(ctx, strip, Math.max(0, b.index), p.x, p.y);
}

/* What the pointer is carrying, drawn where the pointer is. */
function drawCursorCargo() {
	if (!mouse.inside) return;
	if (game.grabbed) {
		Sprites.drawOS(ctx, game.grabbed.cargo,
			       mouse.x - Engine.OS_W / 2,
			       mouse.y - Engine.OS_H / 2);
	} else if (game.bucketGrabbed) {
		Sprites.drawBucket(ctx,
				   mouse.x - Engine.BUCKET_W / 2,
				   mouse.y - Engine.BUCKET_H / 2);
	}
}

function drawIdleBanner() {
	ctx.save();
	ctx.fillStyle = 'rgba(0,0,0,0.35)';
	ctx.fillRect(0, 0, LOGIC, LOGIC);
	ctx.fillStyle = '#e8e8f0';
	ctx.font = 'bold 26px Georgia, serif';
	ctx.textAlign = 'center';
	ctx.fillText('XBill', LOGIC / 2, LOGIC / 2 - 14);
	ctx.font = '12px system-ui, sans-serif';
	ctx.fillStyle = '#a8a8c0';
	ctx.fillText('Stop the virus. Save your computers.',
		     LOGIC / 2, LOGIC / 2 + 10);
	ctx.fillText('Press New Game to start.', LOGIC / 2, LOGIC / 2 + 30);
	ctx.restore();
}

/* ----------------------------------------------------------- game control */

function newGame(level) {
	game = new Engine({ screensize: LOGIC });
	game.start(level || 1);
	running = true;
	paused = false;
	lastTick = performance.now();
	hideOverlay();
	updateStatus();
	updatePauseButton();
}

function updateStatus() {
	if (!game) {
		statusEl.textContent =
			'Bill:-/-  System:-/-/-  Level:-  Score:-';
		return;
	}
	statusEl.textContent = game.statusLine();
}

function updatePauseButton() {
	const btn = document.getElementById('btn-pause');
	btn.textContent = paused ? 'Resume' : 'Pause';
	btn.disabled = !running;
}

function doTick() {
	const events = game.tick();
	updateStatus();

	for (const ev of events) {
		if (ev.type === 'levelcomplete') {
			paused = true;
			updatePauseButton();
			showOverlay(
				`Level ${ev.level} cleared`,
				`<p class="big">Score: ${ev.score}</p>
				 <p class="muted">Level ${ev.level + 1} is
				 waiting.</p>`,
				[{ label: 'Continue', action: resume }]);
		} else if (ev.type === 'gameover') {
			endGame(ev);
		}
	}
}

function endGame(ev) {
	running = false;
	paused = false;
	updatePauseButton();
	updateStatus();

	if (isHighScore(ev.score)) {
		showOverlay('Game over',
			`<p class="big">Score: ${ev.score} &middot;
			 Level ${ev.level}</p>
			 <p>That's a high score. Your name:</p>
			 <input id="hs-name" maxlength="16" value="Player"
			  autocomplete="off">`,
			[{ label: 'Save', action: () => {
				const el = document.getElementById('hs-name');
				const name = (el.value || 'Player').slice(0, 16);
				const list = saveScore(name, ev.level, ev.score);
				const idx = list.findIndex(s =>
					s.name === name && s.score === ev.score);
				showOverlay('High scores',
					scoreTable(list, idx),
					[{ label: 'New game',
					   action: () => newGame(1) },
					 { label: 'Close', action: hideOverlay }]);
			} }]);
		const input = document.getElementById('hs-name');
		if (input) { input.focus(); input.select(); }
	} else {
		showOverlay('Game over',
			`<p class="big">Score: ${ev.score} &middot;
			 Level ${ev.level}</p>
			 <p class="muted">Your network is toast.</p>`,
			[{ label: 'New game', action: () => newGame(1) },
			 { label: 'High scores', action: showScores }]);
	}
}

function resume() {
	hideOverlay();
	paused = false;
	lastTick = performance.now();
	updatePauseButton();
}

function togglePause() {
	if (!running) return;
	paused = !paused;
	if (!paused) lastTick = performance.now();
	updatePauseButton();
	if (paused)
		showOverlay('Paused', '<p class="muted">The clock is stopped.</p>',
			    [{ label: 'Resume', action: resume }]);
	else
		hideOverlay();
}

/* ---------------------------------------------------------------- overlay */

function showOverlay(title, bodyHtml, buttons) {
	overlayBody.innerHTML =
		`<h2>${escapeHtml(title)}</h2>${bodyHtml}<div class="row"></div>`;
	const row = overlayBody.querySelector('.row');
	for (const b of (buttons || [])) {
		const el = document.createElement('button');
		el.textContent = b.label;
		el.onclick = b.action;
		row.appendChild(el);
	}
	overlayEl.classList.add('show');
}

function hideOverlay() {
	overlayEl.classList.remove('show');
}

function showScores() {
	showOverlay('High scores', scoreTable(loadScores(), -1),
		    [{ label: 'Close', action: hideOverlay }]);
}

function showHelp() {
	showOverlay('How to play', `
<p>You are the sysadmin. The little men in suits are carrying
<b>Wingdows</b>&nbsp;&mdash; a virus dressed up as an operating system
&mdash; toward your computers.</p>
<ul>
  <li><b>Click a Bill</b> to stop him. Clicking several at once scores
      <i>n&sup2; &times; 5</i>, so catching a cluster is worth far more than
      picking them off one by one.</li>
  <li>If a Bill reaches a machine he <b>steals its OS</b>, installs the virus,
      and runs off the screen with your software.</li>
  <li>A Bill killed while carrying an OS <b>drops it on the floor</b>.
      Drag it back onto any <b>compatible</b> machine that is off or infected.
      Mac OS only fits a Mac; the PC operating systems (OS/2, BSD, Linux,
      Red Hat, Hurd) fit either PC.</li>
  <li>Infected machines send a <b>spark</b> down the network cables. Drag the
      <b>bucket of water</b> from the top-left corner onto a spark to put it
      out before it reaches the far end.</li>
  <li>The game ends when only one productive computer is left.</li>
</ul>
<p class="muted">Status bar: Bills on/off screen &middot; computers
running&nbsp;/&nbsp;off&nbsp;/&nbsp;infected &middot; level &middot; score.</p>
<p class="muted">Keys: <b>N</b> new game, <b>P</b> pause, <b>H</b> help.</p>`,
		[{ label: 'Close', action: hideOverlay }]);
}

function showAbout() {
	showOverlay('About', `
<p><b>XBill</b> &mdash; a browser port of the X11 game by
<b>Brian Wellington</b> and <b>Matias Duarte</b> (Psychosoft, 1994&ndash;2001),
released under the GPL&nbsp;v2.</p>
<p>The rules here are a direct translation of the xbill&nbsp;2.1 C sources:
same 200&nbsp;ms tick, same spawn curve, same hitboxes, same scoring, same
integer arithmetic. It was verified by compiling the original logic headless
and checking that both produce identical state traces, tick for tick, from the
same random stream.</p>
<p>The artwork is redrawn as vector graphics so it stays sharp at any size;
the original shipped tiny bitmaps.</p>`,
		[{ label: 'Close', action: hideOverlay }]);
}

function askLevel() {
	showOverlay('Jump to level', `
<p>Start at a higher level. You cannot warp backwards during a game.</p>
<input id="lvl" type="number" min="1" max="999" value="${game ? game.level + 1 : 1}">
<p class="muted">Fair warning: from level 45 the original has a signedness
bug that makes Bills spawn every single tick. It is preserved here.</p>`,
		[{ label: 'Go', action: () => {
			const v = parseInt(
				document.getElementById('lvl').value, 10);
			if (!isFinite(v) || v < 1) return;
			if (!game || !running) newGame(v);
			else { game.warpToLevel(v); updateStatus(); }
			hideOverlay();
		} },
		 { label: 'Cancel', action: hideOverlay }]);
}

/* ------------------------------------------------------------------ input */

function pressAt(evt) {
	if (!game || !running || paused) return;
	const p = toLogical(evt);
	mouse.x = p.x; mouse.y = p.y; mouse.inside = true; mouse.down = true;
	game.buttonPress(p.x, p.y);
	updateStatus();
	updateCursor();
}

function releaseAt(evt) {
	if (!game || !running || paused) return;
	const p = toLogical(evt);
	mouse.x = p.x; mouse.y = p.y; mouse.down = false;
	game.buttonRelease(p.x, p.y);
	updateStatus();
	updateCursor();
}

function updateCursor() {
	const carrying = game && (game.grabbed || game.bucketGrabbed);
	canvas.style.cursor = carrying ? 'none'
		: (mouse.down ? 'grabbing' : 'crosshair');
}

canvas.addEventListener('mousedown', e => { e.preventDefault(); pressAt(e); });
window.addEventListener('mouseup', e => {
	if (game && running && !paused && mouse.down) releaseAt(e);
	mouse.down = false;
	updateCursor();
});
canvas.addEventListener('mousemove', e => {
	const p = toLogical(e);
	mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
});
canvas.addEventListener('mouseleave', () => { mouse.inside = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('touchstart', e => { e.preventDefault(); pressAt(e); },
			{ passive: false });
canvas.addEventListener('touchmove', e => {
	e.preventDefault();
	const p = toLogical(e);
	mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); releaseAt(e); },
			{ passive: false });

window.addEventListener('keydown', e => {
	if (e.target.tagName === 'INPUT') {
		if (e.key === 'Enter') {
			const btn = overlayBody.querySelector('.row button');
			if (btn) btn.click();
		}
		return;
	}
	const k = e.key.toLowerCase();
	if (k === 'n') newGame(1);
	else if (k === 'p') togglePause();
	else if (k === 'h' || k === '?') showHelp();
	else if (k === 'escape') hideOverlay();
});

document.getElementById('btn-new').onclick = () => newGame(1);
document.getElementById('btn-pause').onclick = togglePause;
document.getElementById('btn-level').onclick = askLevel;
document.getElementById('btn-scores').onclick = showScores;
document.getElementById('btn-help').onclick = showHelp;
document.getElementById('btn-about').onclick = showAbout;

window.addEventListener('resize', resize);

/* ------------------------------------------------------------- main loop */

function frame(now) {
	if (running && !paused) {
		/* a backgrounded tab must not fast-forward the whole game */
		if (now - lastTick > 2000) lastTick = now - TICK_MS;
		while (now - lastTick >= TICK_MS) {
			lastTick += TICK_MS;
			doTick();
			if (!running || paused) break;
		}
	}
	const alpha = (running && !paused)
		? Math.max(0, Math.min(1, (now - lastTick) / TICK_MS)) : 1;
	render(alpha);
	requestAnimationFrame(frame);
}

resize();
updateStatus();
updatePauseButton();
requestAnimationFrame(frame);

})();

</script>
</body>
</html>
